# One origin for the browser: the built app and the API behind the same host and port, so the
# session and antiforgery cookies stay same-origin and CORS stays off (docs/auth.md).
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://api:8080;
    }

    location /openapi/ {
        proxy_pass http://api:8080;
    }

    # Vite puts a content hash in every asset name, so a changed file gets a new URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always revalidated, so a new build is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes such as /lots/42 have no file: the app's router handles them.
    location / {
        try_files $uri /index.html;
    }
}
