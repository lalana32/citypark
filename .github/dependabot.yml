# Dependabot opens PRs for outdated dependencies; each one has to pass CI like any other PR.
# npm is added together with the frontend (no package.json exists yet).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      # Test packages are referenced by several test projects; one PR keeps them on one version.
      test-tooling:
        patterns:
          - xunit*
          - Microsoft.NET.Test.Sdk
          - coverlet.*
          - Testcontainers.*
          - Microsoft.Extensions.TimeProvider.Testing
      # ASP.NET Core and EF Core ship as one release; a package bumped alone fails the restore
      # with a downgrade error (NU1605). The EF Core provider and naming plugin build on it.
      dotnet-platform:
        patterns:
          - Microsoft.AspNetCore.*
          - Microsoft.EntityFrameworkCore*
          - Microsoft.Extensions.Hosting.Abstractions
          - Npgsql.EntityFrameworkCore.PostgreSQL
          - EFCore.NamingConventions
    ignore:
      # The project stays on the .NET 10 LTS line (docs/decisions.md, D1); a major upgrade is a card of its own.
      - dependency-name: Microsoft.AspNetCore.*
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.EntityFrameworkCore*
        update-types: [version-update:semver-major]
      - dependency-name: Npgsql.EntityFrameworkCore.PostgreSQL
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.Extensions.Hosting.Abstractions
        update-types: [version-update:semver-major]
      # Microsoft.AspNetCore.OpenApi 10.x is built on Microsoft.OpenApi 2.x.
      - dependency-name: Microsoft.OpenApi
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
