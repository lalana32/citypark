name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# A new push to the same PR cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    # This name is the required status check in the main branch protection rule.
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Warnings are errors via Directory.Build.props (TreatWarningsAsErrors).
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # global.json selects Microsoft.Testing.Platform; a run that finds zero tests fails (exit code 8).
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  web:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js (version from web/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Installs exactly what package-lock.json lists, and fails if it is out of date.
      - name: Install
        run: npm ci

      # The Build and test job keeps openapi/v1.json equal to the API; this keeps the types equal to it.
      - name: Check generated API types
        run: |
          npm run generate
          git diff --exit-code -- src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # --wait returns once every service is healthy, or fails if one is not.
      - name: Start the app profile
        run: docker compose --profile app up --build -d --wait

      - name: Smoke test
        run: bash scripts/smoke.sh

      - name: Service logs
        if: ${{ failure() }}
        run: docker compose --profile app logs

      - name: Stop
        if: ${{ always() }}
        run: docker compose --profile app down -v
