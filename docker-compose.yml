# CityPark on Docker. Usage: see "Local database" and "Run the whole stack" in README.md.
#   docker compose up -d --wait             only PostgreSQL, for local development
#   docker compose --profile app up --build the whole system on http://localhost:8080
name: citypark

x-database: &database
  POSTGRES_DB: ${POSTGRES_DB:-citypark}
  POSTGRES_USER: ${POSTGRES_USER:-citypark}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citypark}

services:
  postgres:
    image: postgres:17
    environment: *database
    ports:
      # Bound to loopback only: the database is not reachable from the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes Compose interpolation, so the variables are resolved inside the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot job: applies the pending migrations, then exits. The API starts only after it succeeds.
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: src/CityPark.Api/Dockerfile
      target: migrator
    environment:
      CITYPARK_DB: Host=postgres;Port=5432;Database=${POSTGRES_DB:-citypark};Username=${POSTGRES_USER:-citypark};Password=${POSTGRES_PASSWORD:-citypark}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: src/CityPark.Api/Dockerfile
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__CityPark: Host=postgres;Port=5432;Database=${POSTGRES_DB:-citypark};Username=${POSTGRES_USER:-citypark};Password=${POSTGRES_PASSWORD:-citypark}
      # nginx serves plain HTTP on localhost, so the cookies cannot be Secure (README).
      Cookies__AllowHttp: "true"
      DemoData__Enabled: "true"
      Admin__Email: ${ADMIN_EMAIL:-admin@citypark.test}
      Admin__Password: ${ADMIN_PASSWORD:-Admin-Pass-2026}
    # No published port: the browser reaches the API only through nginx.
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The image has no curl or wget; bash opens the TCP connection itself.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3 && head -n1 <&3 | grep -q " 200 "'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    profiles: [app]
    build:
      context: web
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Through nginx, so it also checks the /health proxy route.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
